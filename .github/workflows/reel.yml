name: VantaBite Reel Preparation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vantabite-reel
  cancel-in-progress: false

jobs:
  prepare-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      WORKER_URL: https://vantabite-automation.brahmi-co-517.workers.dev
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}

    steps:
      - name: Check secret
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "ADMIN_KEY repository secret is missing."
            exit 1
          fi

      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download food image
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.error

          secret = os.environ["ADMIN_KEY"]

          request = urllib.request.Request(
              os.environ["WORKER_URL"] + "/automation/image",
              headers={
                  "Authorization": "Bearer " + secret,
                  "User-Agent": "VantaBite-Automation/1.0",
                  "Accept": "image/jpeg"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  content_type = response.headers.get("Content-Type", "")

                  if not content_type.startswith("image/"):
                      print("Unexpected content type:", content_type)
                      raise SystemExit("Worker did not return an image.")

                  with open("food.jpg", "wb") as output:
                      output.write(response.read())

          except urllib.error.HTTPError as error:
              details = error.read().decode("utf-8", errors="replace")
              details = details.replace(secret, "[hidden]")
              print("HTTP status:", error.code)
              print("Cloudflare Ray:", error.headers.get("CF-Ray", ""))
              print("Response:", details[:3000])
              raise SystemExit(1)

          except urllib.error.URLError:
              raise SystemExit("Could not connect to the Worker.")

          print("Food image downloaded.")
          PY

      - name: Create vertical video with blurred background
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -framerate 30 -i food.jpg \
            -filter_complex \
            "[0:v]split=2[bg][fg];[bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,boxblur=40:2[background];[fg]scale=1080:1920:force_original_aspect_ratio=decrease,setsar=1[foreground];[background][foreground]overlay=(W-w)/2:(H-h)/2,format=yuv420p[v]" \
            -map "[v]" \
            -t 12 \
            -r 30 \
            -c:v libx264 \
            -preset fast \
            -crf 23 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            -an \
            reel.mp4

      - name: Upload video to Worker
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          secret = os.environ["ADMIN_KEY"]

          with open("reel.mp4", "rb") as source:
              video = source.read()

          if len(video) > 20 * 1024 * 1024:
              raise SystemExit("Video exceeds our 20 MB upload limit.")

          request = urllib.request.Request(
              os.environ["WORKER_URL"] + "/automation/video",
              data=video,
              method="POST",
              headers={
                  "Authorization": "Bearer " + secret,
                  "User-Agent": "VantaBite-Automation/1.0",
                  "Content-Type": "video/mp4",
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  result = json.loads(response.read().decode())

                  if result.get("ok") is not True:
                      raise SystemExit("Worker did not confirm the upload.")

                  print("Video uploaded successfully.")
                  print("Video size in bytes:", len(video))

          except urllib.error.HTTPError as error:
              details = error.read().decode("utf-8", errors="replace")
              details = details.replace(secret, "[hidden]")
              print("HTTP status:", error.code)
              print("Cloudflare Ray:", error.headers.get("CF-Ray", ""))
              print("Response:", details[:3000])
              raise SystemExit(1)

          except urllib.error.URLError:
              raise SystemExit("Could not connect to the Worker.")

          print("Video preparation complete. Nothing published to Instagram.")
          PY
