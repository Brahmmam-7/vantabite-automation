name: VantaBite Daily Automation

on:
  schedule:
    # 18:30 IST: prepare in advance, then wait until 19:00 IST.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish today's Reel after preparation"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: vantabite-reel
  cancel-in-progress: false

jobs:
  daily-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      WORKER_URL: https://vantabite-automation.brahmi-co-517.workers.dev
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}

    steps:
      - name: Check secret
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "ADMIN_KEY repository secret is missing."
            exit 1
          fi

      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Generate, prepare and publish daily Reel
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import random
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          now = datetime.datetime.now(IST)
          day = now.date().isoformat()

          base = os.environ["WORKER_URL"]
          secret = os.environ["ADMIN_KEY"]
          publish = os.environ.get("PUBLISH", "").lower() == "true"
          scheduled = os.environ["GITHUB_EVENT_NAME"] == "schedule"

          # A severely delayed scheduled run should not publish overnight.
          if scheduled and (now.hour < 18 or now.hour >= 22):
              raise SystemExit("Outside today's publishing window.")

          def call(route, method="GET", data=None, extra=None, binary=False):
              address = base + route + "?day=" + day
              headers = {
                  "Authorization": "Bearer " + secret,
                  "User-Agent": "VantaBite-Automation/2.0",
                  "Accept": "application/json"
              }
              if extra:
                  headers.update(extra)

              request = urllib.request.Request(
                  address,
                  data=data,
                  method=method,
                  headers=headers
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=240
                  ) as response:
                      body = response.read()

              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  detail = detail.replace(secret, "[hidden]")
                  raise RuntimeError(
                      f"{route}: HTTP {error.code}: {detail[:1500]}"
                  )

              except urllib.error.URLError:
                  raise RuntimeError(
                      route + ": connection failed. Mutation not retried."
                  )

              if binary:
                  return body

              result = json.loads(body)
              if result.get("ok") is not True:
                  raise RuntimeError(
                      result.get("message", "Worker rejected request.")
                  )
              return result

          def summary(text):
              print(text)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                  output.write(text + "\n\n")

          job = call("/daily/start", "POST", b"")["job"]

          if job["state"] == "PUBLISHED" or job.get("published_id"):
              summary("Today's Reel was already published. No duplicate sent.")
              raise SystemExit(0)

          if job["state"] == "NEW":
              print("Generating today's food image:", job["dish"])
              image = call(
                  "/daily/image",
                  "POST",
                  b"",
                  binary=True
              )
              with open("food.jpg", "wb") as output:
                  output.write(image)

              tracks = [
                  {"title": "Carefree"},
                  {"title": "Life of Riley"}
              ]
              random.SystemRandom().shuffle(tracks)

              selected = None

              for track in tracks:
                  filename = urllib.parse.quote(track["title"]) + ".mp3"
                  address = (
                      "https://incompetech.com/music/"
                      "royalty-free/mp3-royaltyfree/" + filename
                  )
                  try:
                      request = urllib.request.Request(
                          address,
                          headers={"User-Agent": "VantaBite-Automation/2.0"}
                      )
                      with urllib.request.urlopen(
                          request, timeout=120
                      ) as response:
                          music = response.read()

                      if (
                          len(music) < 10000 or
                          music.lstrip().startswith(b"<")
                      ):
                          raise ValueError("Invalid audio download.")

                      with open("music.mp3", "wb") as output:
                          output.write(music)

                      subprocess.run([
                          "ffmpeg", "-hide_banner", "-loglevel", "error",
                          "-xerror", "-i", "music.mp3",
                          "-t", "12", "-f", "null", "-"
                      ], check=True)

                      selected = track
                      break

                  except Exception:
                      print("Could not use:", track["title"])

              if selected is None:
                  raise RuntimeError("No music available. Nothing published.")

              filters = (
                  "[0:v]split=2[bg][fg];"
                  "[bg]scale=1080:1920:"
                  "force_original_aspect_ratio=increase,"
                  "crop=1080:1920,setsar=1,boxblur=40:2[background];"
                  "[fg]scale=1080:1920:"
                  "force_original_aspect_ratio=decrease,"
                  "setsar=1[foreground];"
                  "[background][foreground]"
                  "overlay=(W-w)/2:(H-h)/2,format=yuv420p[v];"
                  "[1:a]atrim=duration=12,asetpts=PTS-STARTPTS,"
                  "volume=0.65,afade=t=in:st=0:d=0.5,"
                  "afade=t=out:st=10.5:d=1.5[a]"
              )

              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                  "-loop", "1", "-framerate", "30", "-i", "food.jpg",
                  "-i", "music.mp3",
                  "-filter_complex", filters,
                  "-map", "[v]", "-map", "[a]",
                  "-t", "12", "-r", "30",
                  "-c:v", "libx264", "-preset", "fast", "-crf", "23",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-b:a", "128k",
                  "-ar", "48000", "-ac", "2",
                  "-movflags", "+faststart", "reel.mp4"
              ], check=True)

              with open("reel.mp4", "rb") as source:
                  video = source.read()

              if len(video) > 20 * 1024 * 1024:
                  raise RuntimeError("Video exceeds 20 MB.")

              job = call(
                  "/daily/video",
                  "POST",
                  video,
                  {
                      "Content-Type": "video/mp4",
                      "X-Music-Title": selected["title"]
                  }
              )["job"]

              summary(
                  "Prepared " + job["dish"] +
                  ' with music "' + selected["title"] + '".'
              )

          if job["state"] == "VIDEO_READY":
              # Give public media storage time to propagate before Meta fetches it.
              time.sleep(65)
              job = call("/daily/prepare", "POST", b"")["job"]

          if not job.get("container_id"):
              raise RuntimeError(
                  "Preparation outcome needs inspection. "
                  "No automatic repeat or publish attempted."
              )

          status = None
          for attempt in range(30):
              result = call("/daily/status")
              status = result["status"]
              print("Instagram processing:", status)

              if status == "PUBLISHED":
                  summary("Instagram reports today's Reel is already published.")
                  raise SystemExit(0)

              if status == "FINISHED":
                  break

              if status in ("ERROR", "EXPIRED"):
                  raise RuntimeError(
                      "Instagram processing failed: " +
                      result.get("details", status)
                  )

              time.sleep(20)
          else:
              raise RuntimeError(
                  "Instagram processing did not finish within 10 minutes."
              )

          if not publish:
              summary(
                  "Preview ready. Publishing was disabled for this manual run. "
                  "Scheduled runs publish automatically."
              )
              raise SystemExit(0)

          target = datetime.datetime.combine(
              datetime.date.fromisoformat(day),
              datetime.time(19, 0),
              tzinfo=IST
          )

          while datetime.datetime.now(IST) < target:
              remaining = (
                  target - datetime.datetime.now(IST)
              ).total_seconds()
              time.sleep(min(30, max(0, remaining)))

          current = datetime.datetime.now(IST)

          if current.date().isoformat() != day or current.hour >= 22:
              raise RuntimeError("Publishing window ended. Nothing published.")

          result = call("/daily/publish", "POST", b"")

          summary(
              "Today's Reel published or confirmed already published. "
              "Media ID: " + str(result.get("publishedId", "see Instagram"))
          )
          PY
