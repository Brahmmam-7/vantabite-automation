name: VantaBite Reel Preparation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vantabite-reel
  cancel-in-progress: false

jobs:
  prepare-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      WORKER_URL: https://vantabite-automation.brahmi-co-517.workers.dev
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}

    steps:
      - name: Check secret
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "ADMIN_KEY repository secret is missing."
            exit 1
          fi

      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download food image
        run: |
          python3 - <<'PY'
          import os
          import urllib.request

          request = urllib.request.Request(
              os.environ["WORKER_URL"] + "/automation/image",
              headers={
                  "Authorization": "Bearer " + os.environ["ADMIN_KEY"],
                  "User-Agent": "VantaBite-Automation/1.0",
                  "Accept": "image/jpeg"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  if not response.headers.get(
                      "Content-Type", ""
                  ).startswith("image/"):
                      raise ValueError("Expected an image.")

                  with open("food.jpg", "wb") as output:
                      output.write(response.read())
          except Exception:
              raise SystemExit(
                  "Image download failed. Check Worker and ADMIN_KEY."
              )
          PY

      - name: Automatically select music
        run: |
          python3 - <<'PY'
          import json
          import random
          import urllib.parse
          import urllib.request

          tracks = [
              {"title": "Carefree", "isrc": "USUAN1400037"},
              {"title": "Life of Riley", "isrc": "USUAN1400054"}
          ]

          random.SystemRandom().shuffle(tracks)

          for track in tracks:
              filename = urllib.parse.quote(track["title"]) + ".mp3"
              audio_url = (
                  "https://incompetech.com/music/"
                  "royalty-free/mp3-royaltyfree/" + filename
              )

              request = urllib.request.Request(
                  audio_url,
                  headers={"User-Agent": "VantaBite-Automation/1.0"}
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=120
                  ) as response:
                      audio = response.read()

                  if (
                      len(audio) < 10000 or
                      audio.lstrip().startswith(b"<")
                  ):
                      raise ValueError("Invalid music download.")

                  with open("music.mp3", "wb") as output:
                      output.write(audio)

                  with open("music-credit.json", "w") as output:
                      json.dump(track, output)

                  print("Selected:", track["title"])
                  break
              except Exception:
                  print("Download failed:", track["title"])
          else:
              raise SystemExit("Music download failed.")
          PY

      - name: Validate music
        run: |
          ffmpeg -hide_banner -loglevel error -xerror \
            -i music.mp3 -t 12 -f null -

      - name: Create Reel with music
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -framerate 30 -i food.jpg \
            -i music.mp3 \
            -filter_complex \
            "[0:v]split=2[bg][fg];[bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,boxblur=40:2[background];[fg]scale=1080:1920:force_original_aspect_ratio=decrease,setsar=1[foreground];[background][foreground]overlay=(W-w)/2:(H-h)/2,format=yuv420p[v];[1:a]atrim=duration=12,asetpts=PTS-STARTPTS,volume=0.65,afade=t=in:st=0:d=0.5,afade=t=out:st=10.5:d=1.5[a]" \
            -map "[v]" -map "[a]" \
            -t 12 -r 30 \
            -c:v libx264 -preset fast -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 48000 -ac 2 \
            -movflags +faststart \
            reel.mp4

      - name: Upload Reel and music details
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          with open("music-credit.json") as source:
              track = json.load(source)

          with open("reel.mp4", "rb") as source:
              video = source.read()

          if len(video) > 20 * 1024 * 1024:
              raise SystemExit("Video exceeds 20 MB.")

          request = urllib.request.Request(
              os.environ["WORKER_URL"] + "/automation/video",
              data=video,
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["ADMIN_KEY"],
                  "Content-Type": "video/mp4",
                  "Accept": "application/json",
                  "User-Agent": "VantaBite-Automation/1.0",
                  "X-Music-Title": track["title"]
              }
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=120
              ) as response:
                  result = json.loads(response.read())

              if result.get("ok") is not True:
                  raise SystemExit("Worker did not confirm upload.")

          except urllib.error.HTTPError as error:
              raise SystemExit(
                  "Upload failed. HTTP " + str(error.code)
              )
          except urllib.error.URLError:
              raise SystemExit("Could not connect to Worker.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  "Reel uploaded with music: " + track["title"] +
                  "\n\nCaption and music credit saved by Worker."
                  "\n\nNothing published to Instagram.\n"
              )

          print("Video and music details uploaded.")
          print("Nothing published to Instagram.")
          PY
