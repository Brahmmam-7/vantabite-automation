name: VantaBite Daily Automation

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish today's Reel at or after 7 PM IST"
        type: boolean
        required: true
        default: false

      test_mode:
        description: "Temporary automatic test: publish immediately at any hour"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: vantabite-reel
  cancel-in-progress: false

jobs:
  daily-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      WORKER_URL: https://vantabite-automation.brahmi-co-517.workers.dev
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      PUBLISH: ${{ inputs.publish }}
      TEST_MODE: ${{ inputs.test_mode }}

    steps:
      - name: Check secret
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "ADMIN_KEY repository secret is missing."
            exit 1
          fi

      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Generate, prepare and publish daily Reel
        run: |
          python3 - <<'PY'
